# Runs build, test and clippy on every push and pull request,
# on both Linux and Windows, with a real NVC installed for the
# end-to-end tests.

name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Must match nvc::MINIMUM_VERSION (and the fixtures in tests/fixtures/nvc).
  NVC_VERSION: 1.23.0

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu version pinned because NVC's .deb is built per Ubuntu release.
        os: [ubuntu-24.04, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # eframe needs these system libraries to build on Linux (X11/Wayland).
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dev

      - name: Install NVC (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o nvc.deb \
            "https://github.com/nickg/nvc/releases/download/r${NVC_VERSION}/nvc_${NVC_VERSION}-1_amd64_ubuntu-24.04.deb"
          sudo apt-get install -y ./nvc.deb
          nvc --version

      - name: Install NVC (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/nickg/nvc/releases/download/r$env:NVC_VERSION/nvc-$env:NVC_VERSION.msi"
          Invoke-WebRequest -Uri $url -OutFile nvc.msi
          Start-Process msiexec.exe -ArgumentList '/i', 'nvc.msi', '/quiet', '/norestart' -Wait
          "C:\Program Files\NVC\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "C:\Program Files\NVC\bin\nvc.exe" --version

      # Installs the Rust version pinned in rust-toolchain.toml.
      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      # NVC_REQUIRED makes the end-to-end tests fail (not skip) without nvc.
      # --no-fail-fast runs every crate's tests even after a failure, so
      # one failing test can't hide others. The output is saved for the
      # next step.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee test-output.txt
        env:
          NVC_REQUIRED: "1"

      # Turns failing test names and panic messages into one annotation,
      # which shows on the run's summary page (and through GitHub's API)
      # without opening the full log.
      - name: Summarise failed tests
        if: failure()
        shell: bash
        run: |
          summary=$(grep -E "^---- .* stdout ----|panicked at|^  left:|^ right:|^error: test failed" test-output.txt | head -40 || true)
          # %0A is a line break inside an annotation.
          echo "::error title=Failed tests::${summary//$'\n'/%0A}"

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
