# Workspace root. This file doesn't build anything itself; it lists the
# crates (sub-projects) and holds settings and dependency versions they share.

[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/nvc",
    "crates/project",
    "crates/wave",
    "crates/app",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Licence for our own code: not decided yet (see docs/PLAN.md, Decisions).
publish = false

# Shared dependency versions. A crate opts in with `name.workspace = true`.
# Every entry here has had its licence checked (see CLAUDE.md).
[workspace.dependencies]
# Our own crates
studio-core = { path = "crates/core" }
nvc = { path = "crates/nvc" }
project = { path = "crates/project" }
wave = { path = "crates/wave" }

# Third-party (licence in comment)
# "persistence" lets the app remember recent projects (adds ron: MIT OR Apache-2.0).
eframe = { version = "0.36", features = ["persistence"] } # MIT OR Apache-2.0
rfd = "0.17" # MIT; native open/save dialogs
wellen = "0.25" # BSD-3-Clause; reads FST/VCD/GHW waveforms (Surfer's library)
clap = { version = "4.6", features = ["derive"] } # MIT OR Apache-2.0
serde = { version = "1", features = ["derive"] } # MIT OR Apache-2.0
toml = "1" # MIT OR Apache-2.0
glob = "0.3" # MIT OR Apache-2.0

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
